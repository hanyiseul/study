<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>고객 대시보드</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar customer">
        <div class="brand">
            <div class="brand-mark">C</div>
            <div>
                <strong>WMS 고객</strong>
                <span>Customer</span>
            </div>
        </div>

        <nav class="menu">
            <a class="active">대시보드</a>
            <a>계약 현황</a>
            <a>입고 현황</a>
            <a>재고 현황</a>
            <a>출고 요청</a>
            <a>문의사항</a>
        </nav>

        <form method="post" action="/logout" class="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">로그아웃</button>
        </form>
    </aside>

    <main class="content">
        <section class="hero">
            <p class="eyebrow">CUSTOMER DASHBOARD</p>
            <h1>고객 대시보드</h1>
            <p th:text="${email} + ' 계정으로 로그인했습니다.'"></p>
        </section>

        <section class="summary-grid">
            <article>
                <span>내 계약</span>
                <strong>0</strong>
                <p>본인 계약 조회</p>
            </article>
            <article>
                <span>입고 현황</span>
                <strong>0</strong>
                <p>본인 물품 입고 상태</p>
            </article>
            <article>
                <span>재고 현황</span>
                <strong>0</strong>
                <p>본인 보관 재고</p>
            </article>
            <article>
                <span>출고 현황</span>
                <strong>0</strong>
                <p>본인 출고 요청</p>
            </article>
        </section>

        <section class="panel">
            <h2>고객 권한 확인</h2>
            <p>
                이 화면은 ROLE_CUSTOMER 권한을 가진 사용자만 접근할 수 있다.
                관리자 URL인 /admin/dashboard에 접근하면 권한 차단이 발생한다.
            </p>
        </section>
    </main>
</div>
</body>
</html>
